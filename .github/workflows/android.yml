name: Android APK

# Builds an installable debug APK of the EnkLaw app on every push, and on demand
# (Actions → Android APK → Run workflow). Download it from the run's "Artifacts" section.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync native project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: enklaw-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
